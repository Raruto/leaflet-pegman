<!DOCTYPE html>
<html>

<head>
	<title>leaflet-pegman.js</title>
	<meta http-equiv="content-type" content="text/html; charset=UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">

	<!-- Google Maps API -->
	<!-- <script src="https://maps.googleapis.com/maps/api/js?key=&libraries=geometry"></script> -->

	<!-- Leaflet (JS/CSS) -->
	<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
	<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

	<!-- Leaflet-GoogleMutant -->
	<!-- <script src="https://unpkg.com/leaflet.gridlayer.googlemutant@0.16.0/dist/Leaflet.GoogleMutant.js"></script> -->

	<!-- Leaflet-Pegman -->
	<link rel="stylesheet" href="https://unpkg.com/leaflet-pegman@0.1.7/leaflet-pegman.css" />
	<script src="https://unpkg.com/leaflet-pegman@0.1.7/leaflet-pegman.js"></script>

	<style>
		html,
		body,
		.map,
		.panorama {
			margin: 0;
			padding: 0;
			width: 100%;
			height: 100%;
		}

		.map,
		.panorama {
			height: 50%;
			position: relative !important;
		}
	</style>
	<style>
		/* Fixes Google Mutant Empty attribution */
		.leaflet-bottom.leaflet-left,
		.leaflet-bottom.leaflet-right {
			margin-bottom: initial !important;
		}

		/* Make Google Logo/ToS/Feedback links clickable */
		.leaflet-google-mutant a,
		.leaflet-google-mutant button {
			pointer-events: auto;
		}

		/* Move Google ToS/Feedback to the top */
		.leaflet-google-mutant .gmnoprint,
		.leaflet-google-mutant .gm-style-cc {
			top: 0;
			bottom: auto !important;
		}
	</style>
</head>

<body>

	<div id="map" class="map"></div>
	<div id="panorama" class="panorama"></div>

	<script>
		const map = new L.Map('map', {
			center: [45.47036148132197, 9.179473109543324],
			zoom: 15,
		});
		new L.TileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png', {
			maxZoom: 17,
			attribution: 'Map data: &copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>, <a href="https://viewfinderpanoramas.org">SRTM</a> | Map style: &copy; <a href="https://opentopomap.org">OpenTopoMap</a> (<a href="https://creativecommons.org/licenses/by-sa/3.0/">CC-BY-SA</a>)',
		}).addTo(map);
		const pegmanControl = new L.Control.Pegman({
			apiKey: '', // CHANGE: with your google maps api key
			position: 'bottomright', // position of control inside the map
			theme: "leaflet-pegman-v3-small", // or "leaflet-pegman-v3-default"
			panoDiv: '#panorama'
		});
		pegmanControl.addTo(map);
		pegmanControl.findStreetViewData(45.47036148132197, 9.179473109543324);
	</script>

	<a href="https://github.com/Raruto/leaflet-pegman" class="view-on-github" style="position: fixed;top: 10px;left: calc(50% - 60px);z-index: 9999;"> <img alt="View on Github" src="https://raruto.github.io/img/view-on-github.png" title="View on Github"
		 width="163"> </a>

</body>

</html>
